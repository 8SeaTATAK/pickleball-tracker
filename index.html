<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryde Pickleball Openings</title>
<meta name="description" content="Tennis World North Ryde 全 16 片场 pickleball 空场汇总,每 30 分钟自动刷新。">
<meta name="theme-color" content="#216b43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pickleball">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Ryde Pickleball 空场">
<meta property="og:description" content="Tennis World North Ryde 全 16 片场,每 30 分钟自动刷新">
<meta property="og:image" content="https://8seatatak.github.io/pickleball-tracker/icon-512.png">
<meta property="og:url" content="https://8seatatak.github.io/pickleball-tracker/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f6f5f1; --card:#fdfcfa; --ink:#1c211c; --muted:#71776f; --line:#e2e0d8;
  --turf:#216b43; --clay:#b95c30;
  --free-bg:#d3e9f6; --free-br:#7bb4d6; --free-tx:#155574;
  --un-bg:#eceae4; --un-tx:#a7aca2; --un-br:#e2e0d8;
  --mine-bg:#dcefe1; --mine-br:#3f9c68; --mine-tx:#1c6b3f;
  --head:#eef4f0;
}
@media (prefers-color-scheme:dark){
 :root{
  --paper:#141714; --card:#1a1e1a; --ink:#e9ebe6; --muted:#99a094; --line:#2c312b;
  --turf:#7fd0a1; --clay:#e08a5c;
  --free-bg:#173442; --free-br:#2f6d8c; --free-tx:#8fcdec;
  --un-bg:#20241f; --un-tx:#5c635a; --un-br:#2c312b;
  --mine-bg:#183a27; --mine-br:#3f9c68; --mine-tx:#8ee0ab;
  --head:#1e2620;
 }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:100%;margin:0 auto;padding:28px 22px 70px}
.eyebrow{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.16em;
  font-size:12px;font-weight:600;color:var(--turf)}
h1{font-family:Oswald,sans-serif;font-weight:700;font-size:29px;margin:.2em 0 .1em;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:14px 0 4px;font-size:12.5px;color:var(--muted)}
.legend .k{display:inline-flex;align-items:center;gap:7px}
.legend .box{width:42px;height:20px;border-radius:5px;display:inline-flex;align-items:center;
  justify-content:center;font-size:10px;font-variant-numeric:tabular-nums;border:1px solid}
.legend .box.free{background:var(--free-bg);border-color:var(--free-br);color:var(--free-tx)}
.legend .box.un{background:var(--un-bg);border-color:var(--un-br);color:var(--un-tx)}
.legend .box.mine{background:var(--mine-bg);border-color:var(--mine-br);color:var(--mine-tx);font-weight:600}
.legend .hint{margin-left:auto;font-style:italic}

.board{overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px;max-height:82vh}
table{border-collapse:separate;border-spacing:0;background:var(--card)}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;z-index:3;background:var(--head);padding:0}
thead th.corner{left:0;z-index:4}
.datebtn{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;
  border:0;background:transparent;cursor:pointer;padding:9px 10px 8px;color:inherit;font:inherit;
  border-bottom:3px solid transparent;transition:.15s}
.datebtn:hover{background:var(--free-bg)}
.datebtn.active{border-bottom-color:var(--turf);background:var(--free-bg)}
.datebtn .dd{font-family:Oswald,sans-serif;font-weight:600;font-size:15px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.datebtn .dw{font-size:11px;color:var(--muted)}
.datebtn .dw.we{color:var(--clay);font-weight:600}
.datebtn .dc{font-size:10px;color:var(--turf);font-family:Oswald,sans-serif;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.datebtn.active .dc::after{content:' · 仅可订'}

tbody th.court{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;
  font-family:Oswald,sans-serif;font-weight:600;font-size:13px;padding:8px 14px 8px 12px;white-space:nowrap;
  border-right:2px solid var(--line)}
tbody th.court .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
.dot.p{background:var(--clay)} .dot.s{background:var(--turf)}
tbody tr.tierrow th{position:sticky;left:0;background:var(--head);font-family:Oswald,sans-serif;
  text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;font-weight:600;color:var(--muted);
  padding:5px 12px;z-index:2}
tbody tr.tierrow td{background:var(--head)}

td.cell{padding:6px;min-width:172px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{width:48px;height:22px;border-radius:5px;border:1px solid;display:inline-flex;
  align-items:center;justify-content:center;font-size:10.5px;font-variant-numeric:tabular-nums;font-weight:500}
.chip.free{background:var(--free-bg);border-color:var(--free-br);color:var(--free-tx)}
.chip.un{background:var(--un-bg);border-color:var(--un-br);color:var(--un-tx)}
.chip.mine{background:var(--mine-bg);border-color:var(--mine-br);color:var(--mine-tx);font-weight:600;
  box-shadow:0 0 0 1px var(--mine-br) inset}
td.cell.freeonly .chip.un,td.cell.freeonly .chip.mine{display:none}
td.cell.freeonly .chips:empty::after,td.cell.freeonly.empty::after{content:'—';color:var(--muted);font-size:12px}
.stats{margin-top:34px}
.stats h2{font-family:Oswald,sans-serif;font-weight:700;font-size:22px;margin:.2em 0 .1em}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:130px}
.card b{display:block;font-family:Oswald,sans-serif;font-size:28px;color:var(--turf);font-variant-numeric:tabular-nums}
.card span{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{margin:0 0 10px;font-family:Oswald,sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}
.bar .l{width:54px;flex:none;color:var(--ink)}
.bar .t{flex:1;background:var(--un-bg);border-radius:4px;height:14px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--mine-br);border-radius:4px}
.bar .v{width:44px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
footer{margin-top:22px;font-size:12px;color:var(--muted)}
footer a{color:var(--turf)}
.loading,.err{padding:40px 0;text-align:center;color:var(--muted)}

/* ---------- phone layout: date strip + one court per row ---------- */
.m{display:none}
@media (max-width:760px){
  .wrap{padding:20px 16px 56px}
  h1{font-size:24px}
  .board,.legend .hint{display:none}
  .m{display:block}
  .cards{gap:8px}
  .card{flex:1 1 calc(50% - 4px);min-width:0;padding:10px 12px}
  .card b{font-size:22px}
  .stats h2{font-size:19px}
}
.mdates{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;
  position:sticky;top:0;background:var(--paper);z-index:5}
.mdates::-webkit-scrollbar{display:none}
.mdate{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;
  border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:7px 11px;cursor:pointer;color:inherit;font:inherit}
.mdate .dd{font-family:Oswald,sans-serif;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.mdate .dw{font-size:10.5px;color:var(--muted)}
.mdate .dw.we{color:var(--clay);font-weight:600}
.mdate .dc{font-size:10px;font-family:Oswald,sans-serif;font-weight:600;color:var(--turf);
  font-variant-numeric:tabular-nums}
.mdate.on{background:var(--turf);border-color:var(--turf)}
.mdate.on .dd,.mdate.on .dw,.mdate.on .dc{color:#fff}
.mbar{display:flex;align-items:center;gap:10px;margin:2px 0 8px;font-size:12px;color:var(--muted)}
.mbar button{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:12px;cursor:pointer}
.mbar button.on{background:var(--mine-bg);border-color:var(--mine-br);color:var(--mine-tx);font-weight:600}
.mlist{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.mrow{padding:10px 13px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mct{font-family:Oswald,sans-serif;font-weight:600;font-size:13.5px;margin-bottom:7px}
.mct em{font-style:normal;font-family:Inter,sans-serif;font-weight:400;font-size:11.5px;
  color:var(--muted);margin-left:7px}
.mempty{padding:26px 0;text-align:center;color:var(--muted);font-size:13px}

/* ---------- refresh + edit toolbars ---------- */
#refreshbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0 2px;font-size:12.5px}
#editbar{display:none;align-items:center;gap:9px;flex-wrap:wrap;margin:10px 0 2px;font-size:12.5px}
#editbar.show{display:flex}
#refreshbar button,#editbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:6px 14px;font:inherit;font-size:12.5px;cursor:pointer}
#refreshbar button.go,#editbar button.go{background:var(--turf);border-color:var(--turf);color:#fff;font-weight:600}
#refreshbar button:disabled,#editbar button:disabled{opacity:.45;cursor:default}
#refreshbar .note,#editbar .note{color:var(--muted)}
#refreshbar .note.warn,#editbar .note.warn{color:var(--clay)}
body.editing .chip{cursor:pointer}
body.editing td.cell.freeonly .chip{display:inline-flex}
body.editing .chip.free,body.editing .chip.un{border-style:dashed}
body.editing .chip:active{transform:scale(.94)}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Tennis World · North Ryde</div>
  <h1>Pickleball 空场汇总</h1>
  <p class="sub">全 16 片场 · 30 分钟一格 · 悉尼时间(AEST) · 工作日 19:00 后 / 周末 14:00 后 · 每 30 分钟自动刷新</p>
  <div class="legend">
    <span class="k"><span class="box free">19:00</span> 可预订</span>
    <span class="k"><span class="box un">19:30</span> 已订/不可用</span>
    <span class="k"><span class="box mine">20:00</span> 我的预订</span>
    <span class="hint">点击顶部日期 → 该列只显示可预订</span>
  </div>
  <div id="refreshbar"></div>
  <div id="editbar"></div>
  <div id="board" class="board"><div class="loading">加载中…</div></div>
  <div id="m" class="m"><div class="loading">加载中…</div></div>
  <section class="stats" id="stats"></section>
  <footer id="footer"></footer>
</div>

<script>
const COURTS=[
 {n:'Court 1',k:'Ct1',t:'p'},{n:'Court 2',k:'Ct2',t:'p'},{n:'Court 3',k:'Ct3',t:'p'},{n:'Court 4',k:'Ct4',t:'p'},
 {n:'Court 5',k:'Ct5',t:'s'},{n:'Court 6',k:'Ct6',t:'s'},{n:'Court 7',k:'Ct7',t:'s'},{n:'Court 8',k:'Ct8',t:'s'},
 {n:'Court 9',k:'Ct9',t:'s'},{n:'Court 10',k:'Ct10',t:'s'},{n:'Court 11',k:'Ct11',t:'s'},{n:'Court 12',k:'Ct12',t:'s'},
 {n:'Court 13',k:'Ct13',t:'s'},{n:'Court 14',k:'Ct14',t:'s'},{n:'Court 15',k:'Ct15',t:'s'},{n:'Court 16',k:'Ct16',t:'s'}
];
const DOWCN=['周日','周一','周二','周三','周四','周五','周六'];
const WK=['19:00','19:30','20:00','20:30','21:00','21:30'];
const WE=['14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30'];

// Last payload rendered, so edit mode can re-render without refetching.
let LAST=null;
// fresh=true reads the files straight from the repo through the GitHub API
// (needs the device token), so a just-finished scrape shows up without
// waiting for Pages to redeploy.
async function load(fresh){
  const bust = '?t=' + Date.now();
  const get = fresh && EDIT.token
    ? p=>fetch(`https://api.github.com/repos/${REPO}/contents/${p}?ref=main&t=${Date.now()}`,
        {headers:{Authorization:'Bearer '+EDIT.token,Accept:'application/vnd.github.raw+json'},cache:'no-store'})
    : p=>fetch(p+bust);
  const [availRes, mineRes, histRes] = await Promise.all([
    get('data/availability.json'),
    get('data/mine.json').catch(()=>null),
    get('data/history.json').catch(()=>null)
  ]);
  if(!availRes.ok) throw new Error('availability.json fetch failed');
  const avail = await availRes.json();
  let mine = {};
  if(mineRes && mineRes.ok) mine = await mineRes.json();
  LAST={DATA:avail.data||{}, MINE:mine, gen:avail.generatedAt, HIST:LAST&&LAST.HIST};
  render(LAST.DATA, LAST.MINE, LAST.gen);
  let hist = {};
  if(histRes && histRes.ok) hist = await histRes.json();
  LAST.HIST=hist;
  renderStats(hist, LAST.MINE);
}

function renderStats(HIST, MINE){
  const sum=(m)=>{ // m: {date:{court:[slots]}} -> aggregates (1 slot = 0.5h)
    const r={slots:0,sessions:0,days:0,dow:Array(7).fill(0),court:{},week:{}};
    for(const [date,cs] of Object.entries(m)){
      const n=Object.values(cs).reduce((a,v)=>a+v.length,0); if(!n) continue;
      r.days++; r.slots+=n; r.sessions+=Object.keys(cs).length;
      const d=new Date(date+'T00:00:00'); r.dow[d.getDay()]+=n/2;
      for(const [c,v] of Object.entries(cs)) r.court[c]=(r.court[c]||0)+v.length/2;
      const mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
      const wk=`${mon.getMonth()+1}/${mon.getDate()}`;r.week[wk]=(r.week[wk]||0)+n/2;
    }
    return r;
  };
  const past=sum(HIST), up=sum(MINE);
  const bars=(rows,unit)=>{const mx=Math.max(1,...rows.map(r=>r[1]));
    return rows.map(([l,v])=>`<div class="bar"><span class="l">${l}</span><span class="t"><i style="width:${v/mx*100}%"></i></span><span class="v">${v}${unit}</span></div>`).join('')||'<div class="sub">暂无数据</div>';};
  const dowRows=[1,2,3,4,5,6,0].map(i=>[DOWCN[i],past.dow[i]]);
  const courtRows=Object.entries(past.court).sort((a,b)=>+a[0].slice(2)-+b[0].slice(2)).map(([c,v])=>['Ct '+c.slice(2),v]);
  const weekRows=Object.entries(past.week);
  const el=document.getElementById('stats');
  const dates=Object.keys(HIST).sort();
  const since=dates.length?dates[0].slice(5).replace('-','/'):'';
  el.innerHTML=`<div class="eyebrow">My Bookings</div><h2>我的订场统计</h2>
   <p class="sub">已打过的场次(自 ${since} 起,每次刷新自动归档过期订单)· 取消的不计入</p>
   <div class="cards">
    <div class="card"><b>${past.days}</b><span>已订天数</span></div>
    <div class="card"><b>${past.sessions}</b><span>场地·次(court-sessions)</span></div>
    <div class="card"><b>${past.slots/2}h</b><span>场地总小时</span></div>
    <div class="card"><b>${past.days?(past.slots/2/past.days).toFixed(1):0}h</b><span>平均每天</span></div>
    <div class="card"><b>${up.sessions}</b><span>待打(今日起)· ${up.slots/2}h</span></div>
   </div>
   <div class="charts">
    <div class="panel"><h3>按星期(场地小时)</h3>${bars(dowRows,'h')}</div>
    <div class="panel"><h3>按场地(小时)</h3>${bars(courtRows,'h')}</div>
    <div class="panel"><h3>按周(周一起,小时)</h3>${bars(weekRows,'h')}</div>
   </div>`;
}

function render(DATA, MINE, generatedAt){
  const dates=Object.keys(DATA).sort();
  const meta=dates.map(date=>{
    const d=new Date(date+'T00:00:00');const dow=d.getDay();const weekend=(dow===0||dow===6);
    let total=0;COURTS.forEach(c=>total+=(DATA[date][c.k]||[]).length);
    return {date,dow,weekend,slots:weekend?WE:WK,total,mo:+date.slice(5,7),da:+date.slice(8)};
  });

  const board=document.getElementById('board');
  let h='<table><thead><tr><th class="corner" rowspan="1"></th>';
  meta.forEach((m,i)=>{
    h+=`<th><button class="datebtn" data-col="${i}">
        <span class="dd">${m.mo}/${m.da}</span>
        <span class="dw ${m.weekend?'we':''}">${DOWCN[m.dow]}</span>
        <span class="dc">${m.total} 空</span></button></th>`;
  });
  h+='</tr></thead><tbody>';
  let lastTier='';
  COURTS.forEach(c=>{
    if(c.t!==lastTier){
      const lbl=c.t==='p'?'Premium 专用场':'Standard 多线场';
      h+=`<tr class="tierrow"><th>${lbl}</th>${meta.map(()=>'<td></td>').join('')}</tr>`;
      lastTier=c.t;
    }
    h+=`<tr><th class="court"><span class="dot ${c.t}"></span>${c.n}</th>`;
    meta.forEach((m,i)=>{
      const free=new Set(DATA[m.date][c.k]||[]);
      const mineSet=new Set(((MINE[m.date]||{})[c.k])||[]);
      let chips='';
      m.slots.forEach(t=>{
        const cls = mineSet.has(t) ? 'mine' : (free.has(t) ? 'free' : 'un');
        chips+=`<span class="chip ${cls}" data-d="${m.date}" data-c="${c.k}" data-t="${t}">${t}</span>`;
      });
      h+=`<td class="cell c${i}"><div class="chips">${chips}</div></td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  board.innerHTML=h;
  renderMobile(DATA, MINE, meta);
  renderRefreshBar();
  renderEditBar();

  document.querySelectorAll('.datebtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=btn.dataset.col;
      btn.classList.toggle('active');
      const on=btn.classList.contains('active');
      document.querySelectorAll('td.cell.c'+i).forEach(td=>{
        td.classList.toggle('freeonly',on);
        const anyFree=td.querySelector('.chip.free');
        td.classList.toggle('empty', on && !anyFree);
      });
    });
  });

  const footer=document.getElementById('footer');
  const stamp = generatedAt ? new Date(generatedAt).toLocaleString('zh-CN',{timeZone:'Australia/Sydney'}) : '未知';
  footer.innerHTML = `快照:${stamp}(悉尼时间)· 每 30 分钟自动刷新 · 来源 <a href="https://www.tennisworldonline.com.au/bookacourt/">tennisworldonline.com.au</a> · 空场实时变动,预订前请再确认。`;
}

// Phone view: the 16x8 grid needs ~1400px, so narrow screens get a date strip
// plus one court per row instead. Same data, same render pass.
const MSTATE={i:0,freeOnly:true};

function renderMobile(DATA, MINE, meta){
  const host=document.getElementById('m');
  if(!meta.length){host.innerHTML='<div class="mempty">暂无数据</div>';return;}
  if(MSTATE.i>=meta.length) MSTATE.i=0;
  const m=meta[MSTATE.i];

  const strip=meta.map((x,i)=>`<button class="mdate${i===MSTATE.i?' on':''}" data-i="${i}">
      <span class="dd">${x.mo}/${x.da}</span>
      <span class="dw${x.weekend?' we':''}">${DOWCN[x.dow]}</span>
      <span class="dc">${x.total}</span></button>`).join('');

  const rows=COURTS.map(c=>{
    const free=new Set(DATA[m.date][c.k]||[]);
    const mineSet=new Set(((MINE[m.date]||{})[c.k])||[]);
    if(FO() && !free.size && !mineSet.size) return '';
    const chips=m.slots.map(t=>{
      const cls=mineSet.has(t)?'mine':(free.has(t)?'free':'un');
      if(FO() && cls==='un') return '';
      return `<span class="chip ${cls}" data-d="${m.date}" data-c="${c.k}" data-t="${t}">${t}</span>`;
    }).join('');
    const tag=free.size?`${free.size*0.5}h 可订`:(mineSet.size?'我的预订':'已满');
    return `<div class="mrow"><div class="mct"><span class="dot ${c.t}"></span>${c.n}<em>${tag}</em></div>
      <div class="chips">${chips}</div></div>`;
  }).join('');

  host.innerHTML=`<div class="mdates">${strip}</div>
    <div class="mbar"><button id="mOnly" class="${FO()?'on':''}">只看可订</button>
      <span>${m.total} 个空格 · ${m.total*0.5}h</span></div>
    <div class="mlist">${rows||'<div class="mempty">这天没有空场</div>'}</div>`;

  host.querySelectorAll('.mdate').forEach(b=>b.addEventListener('click',()=>{
    MSTATE.i=+b.dataset.i; renderMobile(DATA,MINE,meta);
  }));
  document.getElementById('mOnly').addEventListener('click',()=>{
    MSTATE.freeOnly=!MSTATE.freeOnly; renderMobile(DATA,MINE,meta);
  });
}

// Lets the page be added to the home screen and still open without signal.
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ---------------------------------------------------------------------------
// Edit mode: tap a slot to mark it as Victor's booking, then commit
// data/mine.json straight to GitHub. The token is entered once per device and
// lives only in that browser's localStorage — it is never part of this repo,
// so anyone else opening the page gets the read-only view.
// ---------------------------------------------------------------------------
const REPO='8SeaTATAK/pickleball-tracker';
const MINE_PATH='data/mine.json';
const EDIT={on:false,dirty:false,busy:false,msg:'',token:localStorage.getItem('pb_token')||''};
const FO=()=>MSTATE.freeOnly && !EDIT.on;

function rerender(){
  const y=scrollY;
  render(LAST.DATA, LAST.MINE, LAST.gen);
  if(LAST.HIST) renderStats(LAST.HIST, LAST.MINE);
  scrollTo(0,y);
}

function sydneyToday(){
  return new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'});
}

// Same discipline as the scraper: never let a past date linger.
function cleanMine(src){
  const today=sydneyToday(), out={};
  for(const d of Object.keys(src).sort()){
    if(d<today) continue;
    const courts={};
    for(const [c,v] of Object.entries(src[d])) if(v && v.length) courts[c]=[...v].sort();
    if(Object.keys(courts).length) out[d]=courts;
  }
  return out;
}

function renderEditBar(){
  const bar=document.getElementById('editbar');
  if(!bar) return;
  const show=!!EDIT.token;
  bar.classList.toggle('show',show);
  document.body.classList.toggle('editing',EDIT.on);
  if(!show){bar.innerHTML='';return;}
  if(!EDIT.on){
    bar.innerHTML=`<button id="eOn">✎ 编辑我的预订</button>
      <span class="note">${EDIT.msg||''}</span>`;
    document.getElementById('eOn').onclick=()=>{EDIT.on=true;EDIT.msg='';rerender();};
    return;
  }
  bar.innerHTML=`<span class="note">点时间格子标记 / 取消我的预订</span>
    <button id="eSave" class="go" ${EDIT.dirty&&!EDIT.busy?'':'disabled'}>${EDIT.busy?'保存中…':'保存到 GitHub'}</button>
    <button id="eOff">退出编辑</button>
    <span class="note${EDIT.msg.startsWith('✗')?' warn':''}">${EDIT.msg}</span>`;
  document.getElementById('eSave').onclick=saveMine;
  document.getElementById('eOff').onclick=()=>{
    if(EDIT.dirty && !confirm('有未保存的改动,确定退出?')) return;
    EDIT.on=false;EDIT.dirty=false;EDIT.msg='';
    load().catch(()=>{});
  };
}

document.addEventListener('click',(e)=>{
  if(!EDIT.on || EDIT.busy) return;
  const chip=e.target.closest('.chip[data-d]');
  if(!chip) return;
  const {d,c,t}=chip.dataset;
  const m=LAST.MINE;
  m[d]=m[d]||{};
  const slots=new Set(m[d][c]||[]);
  slots.has(t) ? slots.delete(t) : slots.add(t);
  m[d][c]=[...slots].sort();
  if(!m[d][c].length) delete m[d][c];
  if(!Object.keys(m[d]).length) delete m[d];
  EDIT.dirty=true;EDIT.msg='';
  rerender();
});

async function saveMine(){
  EDIT.busy=true;EDIT.msg='';renderEditBar();
  const api=`https://api.github.com/repos/${REPO}/contents/${MINE_PATH}`;
  const headers={Authorization:'Bearer '+EDIT.token,Accept:'application/vnd.github+json'};
  const text=JSON.stringify(cleanMine(LAST.MINE),null,2)+'\n';
  const content=btoa(String.fromCharCode(...new TextEncoder().encode(text)));
  try{
    let saved=false;
    for(let attempt=0;attempt<2 && !saved;attempt++){
      const cur=await fetch(`${api}?ref=main&t=${Date.now()}`,{headers,cache:'no-store'});
      if(cur.status===401||cur.status===403) throw new Error('令牌无效或权限不足');
      if(!cur.ok) throw new Error('读取失败 '+cur.status);
      const {sha}=await cur.json();
      const res=await fetch(api,{method:'PUT',
        headers:{...headers,'Content-Type':'application/json'},
        body:JSON.stringify({message:'Update my bookings from phone',content,sha,branch:'main'})});
      if(res.ok){saved=true;break;}
      if(res.status!==409) throw new Error('保存失败 '+res.status);
    }
    if(!saved) throw new Error('保存冲突,请再试一次');
    EDIT.dirty=false;
    EDIT.msg='✓ 已保存 · 页面约 1 分钟后更新';
  }catch(err){
    EDIT.msg='✗ '+err.message;
  }finally{
    EDIT.busy=false;renderEditBar();
  }
}

// ---------------------------------------------------------------------------
// Refresh from source: MindBody sends no CORS headers, so the browser can't
// read it directly. Instead the button fires the scrape workflow on GitHub
// Actions, waits for it to finish, then pulls the new files via the API.
// Needs the device token to also carry Actions: Read and write.
// ---------------------------------------------------------------------------
const WORKFLOW='refresh.yml';
const RF={busy:false,msg:''};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function renderRefreshBar(){
  const bar=document.getElementById('refreshbar');
  if(!bar) return;
  const stamp=LAST&&LAST.gen?new Date(LAST.gen).toLocaleString('zh-CN',
    {timeZone:'Australia/Sydney',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  const label=RF.busy?'刷新中…':(EDIT.token?'↻ 从源站刷新':'↻ 重新加载');
  const note=[RF.msg, stamp&&`数据快照 ${stamp}`, !EDIT.token&&'从源站刷新需先在本设备打开 #edit 登录']
    .filter(Boolean).join(' · ');
  bar.innerHTML=`<button id="rBtn" class="go" ${RF.busy||EDIT.on?'disabled':''}>${label}</button>
    <span class="note${RF.msg.startsWith('✗')?' warn':''}">${note}</span>`;
  document.getElementById('rBtn').onclick=EDIT.token?refreshFromSource:()=>{
    RF.msg='';load().catch(e=>{RF.msg='✗ '+e.message;renderRefreshBar();});
  };
}

async function refreshFromSource(){
  RF.busy=true;RF.msg='已触发,正在排队…';renderRefreshBar();
  const api=`https://api.github.com/repos/${REPO}/actions`;
  const headers={Authorization:'Bearer '+EDIT.token,Accept:'application/vnd.github+json'};
  const since=Date.now();
  try{
    const r=await fetch(`${api}/workflows/${WORKFLOW}/dispatches`,{method:'POST',
      headers:{...headers,'Content-Type':'application/json'},
      body:JSON.stringify({ref:'main',return_run_details:true})});
    if(r.status===401||r.status===403||r.status===404) throw new Error('令牌没有 Actions 读写权限(见 README)');
    if(!r.ok) throw new Error('触发失败 '+r.status);
    let runId=null;
    if(r.status===200){try{runId=(await r.json()).workflow_run_id||null;}catch{}}
    let run=null;
    while(Date.now()-since<5*60e3){
      await sleep(4000);
      if(!runId){
        // Older API: no run id in the reply, so pick the dispatch run we just started.
        const l=await fetch(`${api}/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=5&t=${Date.now()}`,{headers,cache:'no-store'});
        if(l.ok){
          const hit=(await l.json()).workflow_runs.find(x=>Date.parse(x.created_at)>=since-30e3);
          if(hit) runId=hit.id;
        }
        continue;
      }
      const g=await fetch(`${api}/runs/${runId}?t=${Date.now()}`,{headers,cache:'no-store'});
      if(!g.ok) continue;
      run=await g.json();
      if(run.status==='completed') break;
      RF.msg=run.status==='in_progress'?'正在从源站抓取 16 片场…':'已触发,正在排队…';
      renderRefreshBar();
    }
    if(!run||run.status!=='completed') throw new Error('等了 5 分钟还没完成,稍后再看');
    if(run.conclusion!=='success') throw new Error('抓取失败('+run.conclusion+')');
    await load(true);
    RF.msg='✓ 已从源站更新';
  }catch(err){
    RF.msg='✗ '+err.message;
  }finally{
    RF.busy=false;renderRefreshBar();
  }
}

function initEdit(){
  if(location.hash==='#edit'){
    history.replaceState(null,'',location.pathname+location.search);
    if(!EDIT.token){
      const t=prompt('粘贴 GitHub fine-grained 令牌(只给本仓库 Contents + Actions 读写权限):','');
      if(t && t.trim()){EDIT.token=t.trim();localStorage.setItem('pb_token',EDIT.token);}
    }
    if(EDIT.token) EDIT.on=true;
  }
  if(location.hash==='#forget'){
    localStorage.removeItem('pb_token');EDIT.token='';EDIT.on=false;
    history.replaceState(null,'',location.pathname+location.search);
    alert('已清除这台设备上的令牌。');
  }
}
initEdit();

load().catch(e=>{
  document.getElementById('board').innerHTML = `<div class="err">数据加载失败:${e.message}</div>`;
});
</script>
