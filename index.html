<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryde Pickleball Openings</title>
<meta name="description" content="Tennis World North Ryde 全 16 片场 pickleball 空位总览，每 30 分钟自动刷新。">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pickleball">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Ryde Pickleball 空位总览">
<meta property="og:description" content="Tennis World North Ryde 全 16 片场，每 30 分钟自动刷新">
<meta property="og:image" content="https://8seatatak.github.io/pickleball-tracker/icon-512.png">
<meta property="og:url" content="https://8seatatak.github.io/pickleball-tracker/">
<style>
:root{
  --bg:#fafaf9; --card-bg:#ffffff; --text:#1c1917; --text-secondary:#78716c;
  --border:#e7e5e4; --accent:#0d9488; --accent-light:#ccfbf1;
  --available:#16a34a; --available-bg:#dcfce7;
  --unavailable:#d4d4d8; --unavailable-bg:#f4f4f5;
  --premium-accent:#7c3aed; --premium-bg:#f5f3ff;
  --header-bg:#f5f5f4; --warn:#c2410c; --shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1a1a; --card-bg:#262626; --text:#e7e5e4; --text-secondary:#a8a29e;
    --border:#3a3a3a; --accent:#2dd4bf; --accent-light:#134e4a;
    --available:#4ade80; --available-bg:#14532d;
    --unavailable:#525252; --unavailable-bg:#2a2a2a;
    --premium-accent:#a78bfa; --premium-bg:#2e1065;
    --header-bg:#2a2a2a; --warn:#fb923c; --shadow:0 1px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1a1a; --card-bg:#262626; --text:#e7e5e4; --text-secondary:#a8a29e;
  --border:#3a3a3a; --accent:#2dd4bf; --accent-light:#134e4a;
  --available:#4ade80; --available-bg:#14532d;
  --unavailable:#525252; --unavailable-bg:#2a2a2a;
  --premium-accent:#a78bfa; --premium-bg:#2e1065;
  --header-bg:#2a2a2a; --warn:#fb923c; --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);
  color:var(--text);line-height:1.5;padding:20px 16px 60px;max-width:1280px;margin:0 auto;-webkit-font-smoothing:antialiased}
h1{font-size:1.4rem;font-weight:700;margin-bottom:2px;letter-spacing:-.02em}
.subtitle{color:var(--text-secondary);font-size:.82rem;margin-bottom:4px}
.source-note{color:var(--text-secondary);font-size:.72rem;margin-bottom:14px}
.source-note a{color:var(--accent)}

/* refresh + edit toolbars */
.bars{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
#refreshbar,#editbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:.8rem}
#editbar:empty{display:none}
.bars button{border:1px solid var(--border);background:var(--card-bg);color:var(--text);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:.78rem;cursor:pointer;box-shadow:var(--shadow)}
.bars button.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.bars button:disabled{opacity:.45;cursor:default}
.stamp{font-weight:700;color:var(--accent)}
.note{color:var(--text-secondary)}
.note.warn{color:var(--warn)}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-size:.78rem;color:var(--text-secondary)}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:11px;height:11px;border-radius:3px}
.legend-dot.avail{background:var(--available-bg);border:1px solid var(--available)}
.legend-dot.unavail{background:var(--unavailable-bg);border:1px solid var(--unavailable)}
.legend-dot.mine{background:var(--premium-accent);border:1px solid var(--premium-accent)}

.summary-card{background:var(--accent-light);border:1px solid var(--accent);border-radius:8px;padding:14px;margin-bottom:18px}
.summary-card h2{font-size:.95rem;font-weight:700;margin-bottom:6px;color:var(--accent)}
.summary-card p{font-size:.82rem;margin-bottom:5px;cursor:pointer;border-radius:4px}
.summary-card p:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.summary-card p:last-child{margin-bottom:0}
.summary-card strong{font-weight:600}
.summary-card .mine-tag{color:var(--premium-accent);font-weight:600}

.tabs-wrap{overflow-x:auto;margin-bottom:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  position:sticky;top:0;background:var(--bg);z-index:5}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;border-bottom:2px solid var(--border);min-width:max-content}
.tab{padding:6px 14px;cursor:pointer;font-size:.8rem;font-weight:500;color:var(--text-secondary);
  border:0;background:none;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:all .15s;user-select:none;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab.weekend{font-style:italic}
.tab .cnt{font-size:.68rem;opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}
.tab.has-mine::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--premium-accent);margin-left:4px;vertical-align:middle}

.day-info{font-size:.75rem;color:var(--text-secondary);margin-bottom:10px;padding:6px 10px;
  background:var(--header-bg);border-radius:5px;display:inline-block}
.section-title{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-secondary);margin:12px 0 6px;padding-left:4px}
.court-row{display:grid;grid-template-columns:90px 1fr;align-items:center;background:var(--card-bg);
  border:1px solid var(--border);border-radius:7px;padding:8px 12px;box-shadow:var(--shadow);min-height:40px;margin-bottom:5px}
.court-row.premium{border-left:3px solid var(--premium-accent)}
.court-label{font-weight:600;font-size:.78rem;white-space:nowrap}
.court-label .type-tag{font-size:.62rem;font-weight:500;color:var(--text-secondary);display:block;margin-top:1px}
.court-label .type-tag.prem{color:var(--premium-accent)}
.slots{display:flex;gap:3px;flex-wrap:wrap}
.slot{font-size:.68rem;font-weight:500;padding:2px 6px;border-radius:3px;font-variant-numeric:tabular-nums;
  border:1px solid;min-width:40px;text-align:center}
.slot.avail{background:var(--available-bg);color:var(--available);border-color:var(--available)}
.slot.unavail{background:var(--unavailable-bg);color:var(--unavailable);border-color:var(--unavailable);opacity:.4}
.slot.booked{background:var(--premium-accent);color:#fff;border-color:var(--premium-accent);font-weight:700}
.no-slots{font-size:.75rem;color:var(--unavailable);font-style:italic}
.loading,.err{padding:40px 0;text-align:center;color:var(--text-secondary)}

/* edit mode: every slot is tappable */
body.editing .slot{cursor:pointer}
body.editing .slot.unavail{opacity:.75;border-style:dashed}
body.editing .slot.avail{border-style:dashed}
body.editing .slot:active{transform:scale(.94)}

/* stats */
.stats{margin-top:30px}
.stats h2{font-size:1.15rem;font-weight:700;margin-bottom:2px;letter-spacing:-.01em}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:120px;box-shadow:var(--shadow)}
.card b{display:block;font-size:1.5rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.card span{font-size:.72rem;color:var(--text-secondary)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.panel{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow)}
.panel h3{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);margin-bottom:8px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.75rem}
.bar .l{width:52px;flex:none}
.bar .t{flex:1;background:var(--unavailable-bg);border-radius:3px;height:12px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--premium-accent);border-radius:3px}
.bar .v{width:42px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)}
footer{margin-top:22px;font-size:.72rem;color:var(--text-secondary)}
footer a{color:var(--accent)}

@media (max-width:600px){
  body{padding:16px 16px 50px}
  h1{font-size:1.15rem}
  .court-row{grid-template-columns:65px 1fr;padding:6px 8px}
  .court-label{font-size:.72rem}
  .slot{font-size:.62rem;padding:2px 4px;min-width:34px}
  .tab{padding:6px 10px;font-size:.72rem}
  .card{flex:1 1 calc(50% - 5px);min-width:0;padding:8px 12px}
  .card b{font-size:1.25rem}
}
</style>
</head>
<body>
<h1>Tennis World North Ryde — Pickleball 空位总览</h1>
<p class="subtitle" id="range">Courts 1–16 · 工作日 7–10PM / 周末 2–10PM</p>
<div class="bars"><div id="refreshbar"></div><div id="editbar"></div></div>
<p class="source-note">数据源：Tennis World 官网预订系统（MindBody），GitHub Actions 每 30 分钟自动抓取一次。空场实时变动，预订前请到
  <a href="https://www.tennisworldonline.com.au/bookacourt/">官网</a> 再确认。10:00 PM 起始时段不开放预订。</p>

<div class="legend">
  <div class="legend-item"><div class="legend-dot avail"></div> 可订</div>
  <div class="legend-item"><div class="legend-dot unavail"></div> 已满</div>
  <div class="legend-item"><div class="legend-dot mine"></div> 我的预订 ✓</div>
</div>

<div class="summary-card">
  <h2>订场推荐（按当前数据自动生成）</h2>
  <div id="summary"><p>加载中…</p></div>
</div>

<div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
<div id="panel"><div class="loading">加载中…</div></div>

<section class="stats" id="stats"></section>
<footer id="footer"></footer>

<script>
const COURTS=[];
for(let i=1;i<=16;i++) COURTS.push({k:'Ct'+i,n:i<10?'Ct '+i:'Ct'+i,t:i<=4?'Premium':'Standard',g:i<=4?'P':i<=8?'A':i<=12?'B':'C'});
const GL={P:'Premium (Ct 1-4) A$35/hr',A:'Std A (5-8) A$30/hr 布局:6,7上/5,8下',
  B:'Std B (9-12) A$30/hr 布局:10,11上/9,12下',C:'Std C (13-16) A$30/hr 布局:14,15上/13,16下'};
const DOW=['日','一','二','三','四','五','六'];
const DOWCN=['周日','周一','周二','周三','周四','周五','周六'];
const WK=['19:00','19:30','20:00','20:30','21:00','21:30'];
const WE=['14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30'];
// 24h data keys, shown as 12h like the booking site ("8:30").
const lbl=t=>{const [h,m]=t.split(':');return (+h>12?+h-12:+h)+':'+m;};

let LAST=null;
const VIEW={date:null};
try{VIEW.date=sessionStorage.getItem('pb_day');}catch{}

// fresh=true reads the files straight from the repo through the GitHub API
// (needs the device token), so a just-finished scrape shows up without
// waiting for Pages to redeploy.
async function load(fresh){
  const bust='?t='+Date.now();
  const get=fresh&&EDIT.token
    ? p=>fetch(`https://api.github.com/repos/${REPO}/contents/${p}?ref=main&t=${Date.now()}`,
        {headers:{Authorization:'Bearer '+EDIT.token,Accept:'application/vnd.github.raw+json'},cache:'no-store'})
    : p=>fetch(p+bust);
  const [availRes,mineRes,histRes]=await Promise.all([
    get('data/availability.json'),
    get('data/mine.json').catch(()=>null),
    get('data/history.json').catch(()=>null)
  ]);
  if(!availRes.ok) throw new Error('availability.json 读取失败');
  const avail=await availRes.json();
  let mine={};
  if(mineRes&&mineRes.ok) mine=await mineRes.json();
  LAST={DATA:avail.data||{},MINE:mine,gen:avail.generatedAt,HIST:LAST&&LAST.HIST};
  render();
  let hist={};
  if(histRes&&histRes.ok) hist=await histRes.json();
  LAST.HIST=hist;
  renderStats(hist,LAST.MINE);
}

function dayMeta(){
  const {DATA,MINE}=LAST;
  return Object.keys(DATA).sort().map(date=>{
    const d=new Date(date+'T00:00:00'),dow=d.getDay(),weekend=dow===0||dow===6;
    const slots=weekend?WE:WK;
    let total=0,full=[],prime=[],mine=0;
    COURTS.forEach(c=>{
      const a=DATA[date][c.k]||[];total+=a.length;
      if(a.length===slots.length) full.push(c.k.slice(2));
      if(a.includes('20:00')&&a.includes('20:30')) prime.push(c.k.slice(2));
      mine+=(((MINE[date]||{})[c.k])||[]).length;
    });
    return {date,dow,weekend,slots,total,full,prime,mine,md:`${+date.slice(5,7)}/${+date.slice(8)}`};
  });
}

function render(){
  const meta=dayMeta();
  renderRefreshBar();renderEditBar();
  if(!meta.length){document.getElementById('panel').innerHTML='<div class="loading">暂无数据</div>';return;}
  if(!meta.some(m=>m.date===VIEW.date)){
    const today=sydneyToday();
    VIEW.date=(meta.find(m=>m.date>=today)||meta[0]).date;
  }
  document.getElementById('range').textContent=
    `Courts 1–16 · ${DOWCN[meta[0].dow]} ${meta[0].md} 至 ${DOWCN[meta.at(-1).dow]} ${meta.at(-1).md} · 工作日 7–10PM / 周末 2–10PM`;

  document.getElementById('tabs').innerHTML=meta.map(m=>
    `<button class="tab${m.weekend?' weekend':''}${m.mine?' has-mine':''}${m.date===VIEW.date?' active':''}" data-day="${m.date}">${DOW[m.dow]} ${m.md}<span class="cnt">${m.total}</span></button>`).join('');

  document.getElementById('summary').innerHTML=meta.map(m=>{
    const parts=[];
    if(!m.total) parts.push('已无空位');
    else{
      parts.push(`共 ${m.total} 个空格`);
      if(m.full.length) parts.push('全通：Ct'+m.full.join('/'));
      parts.push(m.prime.length?'8–9 PM 可订：Ct'+m.prime.join('/'):'8–9 PM 无整小时空场');
    }
    if(m.mine) parts.push(`<span class="mine-tag">我的预订 ${m.mine/2}h</span>`);
    return `<p data-day="${m.date}"><strong>${DOWCN[m.dow]} ${m.md}</strong> — ${parts.join('；')}</p>`;
  }).join('');

  renderDay(meta.find(m=>m.date===VIEW.date));

  const tab=document.querySelector('.tab.active');
  if(tab){ // keep the active tab in view sideways only; never move the page
    const w=document.querySelector('.tabs-wrap');
    if(tab.offsetLeft<w.scrollLeft||tab.offsetLeft+tab.offsetWidth>w.scrollLeft+w.clientWidth)
      w.scrollLeft=tab.offsetLeft-16;
  }

  const stamp=LAST.gen?new Date(LAST.gen).toLocaleString('zh-CN',{timeZone:'Australia/Sydney'}):'未知';
  document.getElementById('footer').innerHTML=`快照：${stamp}（悉尼时间）· 来源 <a href="https://www.tennisworldonline.com.au/bookacourt/">tennisworldonline.com.au</a>`;
}

function renderDay(m){
  const {DATA,MINE}=LAST;
  let h=`<div class="day-info">${m.weekend?'Weekend 2:00-10:00 PM':'Weekday 7:00-10:00 PM'} (${m.slots.length} slots) · ${m.total} 个空格 · ${m.total/2}h</div>`;
  let lastG='';
  COURTS.forEach(c=>{
    if(c.g!==lastG){lastG=c.g;h+=`<div class="section-title">${GL[c.g]}</div>`;}
    const avail=new Set(DATA[m.date][c.k]||[]);
    const mine=new Set(((MINE[m.date]||{})[c.k])||[]);
    const isPrem=c.t==='Premium';
    const slots=m.slots.map(t=>{
      const cls=mine.has(t)?'booked':avail.has(t)?'avail':'unavail';
      return `<span class="slot ${cls}" data-d="${m.date}" data-c="${c.k}" data-t="${t}"${cls==='booked'?' title="我的预订"':''}>${lbl(t)}${cls==='booked'?'✓':''}</span>`;
    }).join('');
    const any=avail.size||mine.size||EDIT.on;
    h+=`<div class="court-row${isPrem?' premium':''}"><div class="court-label">${c.n}<span class="type-tag${isPrem?' prem':''}">${c.t} ${avail.size}/${m.slots.length}</span></div>
      <div class="slots">${any?slots:'<span class="no-slots">无可用</span>'}</div></div>`;
  });
  document.getElementById('panel').innerHTML=h;
}

function pick(day){
  VIEW.date=day;
  try{sessionStorage.setItem('pb_day',day);}catch{}
  render();
}
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(t) pick(t.dataset.day);
});
document.getElementById('summary').addEventListener('click',e=>{
  const p=e.target.closest('p[data-day]');if(!p) return;
  pick(p.dataset.day);
  document.querySelector('.tabs-wrap').scrollIntoView({behavior:'smooth',block:'start'});
});

function renderStats(HIST,MINE){
  const sum=m=>{ // {date:{court:[slots]}} -> aggregates (1 slot = 0.5h)
    const r={slots:0,sessions:0,days:0,dow:Array(7).fill(0),court:{},week:{}};
    for(const [date,cs] of Object.entries(m)){
      const n=Object.values(cs).reduce((a,v)=>a+v.length,0);if(!n) continue;
      r.days++;r.slots+=n;r.sessions+=Object.keys(cs).length;
      const d=new Date(date+'T00:00:00');r.dow[d.getDay()]+=n/2;
      for(const [c,v] of Object.entries(cs)) r.court[c]=(r.court[c]||0)+v.length/2;
      const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
      const wk=`${mon.getMonth()+1}/${mon.getDate()}`;r.week[wk]=(r.week[wk]||0)+n/2;
    }
    return r;
  };
  const past=sum(HIST),up=sum(MINE);
  const bars=(rows,unit)=>{const mx=Math.max(1,...rows.map(r=>r[1]));
    return rows.map(([l,v])=>`<div class="bar"><span class="l">${l}</span><span class="t"><i style="width:${v/mx*100}%"></i></span><span class="v">${v}${unit}</span></div>`).join('')||'<div class="subtitle">暂无数据</div>';};
  const dowRows=[1,2,3,4,5,6,0].map(i=>[DOWCN[i],past.dow[i]]);
  const courtRows=Object.entries(past.court).sort((a,b)=>+a[0].slice(2)-+b[0].slice(2)).map(([c,v])=>['Ct '+c.slice(2),v]);
  const weekRows=Object.entries(past.week);
  const dates=Object.keys(HIST).sort();
  const since=dates.length?dates[0].slice(5).replace('-','/'):'';
  document.getElementById('stats').innerHTML=`<h2>我的订场统计</h2>
   <p class="subtitle">已打过的场次（自 ${since} 起，每次刷新自动归档过期订单）· 取消的不计入</p>
   <div class="cards">
    <div class="card"><b>${past.days}</b><span>已订天数</span></div>
    <div class="card"><b>${past.sessions}</b><span>场地·次</span></div>
    <div class="card"><b>${past.slots/2}h</b><span>场地总小时</span></div>
    <div class="card"><b>${past.days?(past.slots/2/past.days).toFixed(1):0}h</b><span>平均每天</span></div>
    <div class="card"><b>${up.sessions}</b><span>待打（今日起）· ${up.slots/2}h</span></div>
   </div>
   <div class="charts">
    <div class="panel"><h3>按星期（场地小时）</h3>${bars(dowRows,'h')}</div>
    <div class="panel"><h3>按场地（小时）</h3>${bars(courtRows,'h')}</div>
    <div class="panel"><h3>按周（周一起，小时）</h3>${bars(weekRows,'h')}</div>
   </div>`;
}

// Lets the page be added to the home screen and still open without signal.
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ---------------------------------------------------------------------------
// Edit mode: tap a slot to mark it as my booking, then commit data/mine.json
// straight to GitHub. The token is entered once per device and lives only in
// that browser's localStorage — it is never part of this repo, so anyone else
// opening the page gets the read-only view.
// ---------------------------------------------------------------------------
const REPO='8SeaTATAK/pickleball-tracker';
const MINE_PATH='data/mine.json';
let savedToken='';
try{savedToken=localStorage.getItem('pb_token')||'';}catch{}
const EDIT={on:false,dirty:false,busy:false,msg:'',token:savedToken};

function rerender(){
  const y=scrollY;
  render();
  if(LAST.HIST) renderStats(LAST.HIST,LAST.MINE);
  scrollTo(0,y);
}

function sydneyToday(){
  return new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'});
}

// Same discipline as the scraper: never let a past date linger.
function cleanMine(src){
  const today=sydneyToday(),out={};
  for(const d of Object.keys(src).sort()){
    if(d<today) continue;
    const courts={};
    for(const [c,v] of Object.entries(src[d])) if(v&&v.length) courts[c]=[...v].sort();
    if(Object.keys(courts).length) out[d]=courts;
  }
  return out;
}

function renderEditBar(){
  const bar=document.getElementById('editbar');
  document.body.classList.toggle('editing',EDIT.on);
  if(!EDIT.token){bar.innerHTML='';return;}
  if(!EDIT.on){
    bar.innerHTML=`<button id="eOn">✎ 编辑我的预订</button><span class="note">${EDIT.msg||''}</span>`;
    document.getElementById('eOn').onclick=()=>{EDIT.on=true;EDIT.msg='';rerender();};
    return;
  }
  bar.innerHTML=`<span class="note">点时间格子标记 / 取消我的预订</span>
    <button id="eSave" class="go" ${EDIT.dirty&&!EDIT.busy?'':'disabled'}>${EDIT.busy?'保存中…':'保存到 GitHub'}</button>
    <button id="eOff">退出编辑</button>
    <span class="note${EDIT.msg.startsWith('✗')?' warn':''}">${EDIT.msg}</span>`;
  document.getElementById('eSave').onclick=saveMine;
  document.getElementById('eOff').onclick=()=>{
    if(EDIT.dirty&&!confirm('有未保存的改动，确定退出？')) return;
    EDIT.on=false;EDIT.dirty=false;EDIT.msg='';
    load().catch(()=>{});
  };
}

document.addEventListener('click',e=>{
  if(!EDIT.on||EDIT.busy) return;
  const s=e.target.closest('.slot[data-d]');
  if(!s) return;
  const {d,c,t}=s.dataset,m=LAST.MINE;
  m[d]=m[d]||{};
  const set=new Set(m[d][c]||[]);
  set.has(t)?set.delete(t):set.add(t);
  m[d][c]=[...set].sort();
  if(!m[d][c].length) delete m[d][c];
  if(!Object.keys(m[d]).length) delete m[d];
  EDIT.dirty=true;EDIT.msg='';
  rerender();
});

async function saveMine(){
  EDIT.busy=true;EDIT.msg='';renderEditBar();
  const api=`https://api.github.com/repos/${REPO}/contents/${MINE_PATH}`;
  const headers={Authorization:'Bearer '+EDIT.token,Accept:'application/vnd.github+json'};
  const text=JSON.stringify(cleanMine(LAST.MINE),null,2)+'\n';
  const content=btoa(String.fromCharCode(...new TextEncoder().encode(text)));
  try{
    let saved=false;
    for(let attempt=0;attempt<2&&!saved;attempt++){
      const cur=await fetch(`${api}?ref=main&t=${Date.now()}`,{headers,cache:'no-store'});
      if(cur.status===401||cur.status===403) throw new Error('令牌无效或权限不足');
      if(!cur.ok) throw new Error('读取失败 '+cur.status);
      const {sha}=await cur.json();
      const res=await fetch(api,{method:'PUT',
        headers:{...headers,'Content-Type':'application/json'},
        body:JSON.stringify({message:'Update my bookings from phone',content,sha,branch:'main'})});
      if(res.ok){saved=true;break;}
      if(res.status!==409) throw new Error('保存失败 '+res.status);
    }
    if(!saved) throw new Error('保存冲突，请再试一次');
    EDIT.dirty=false;
    EDIT.msg='✓ 已保存 · 页面约 1 分钟后更新';
  }catch(err){
    EDIT.msg='✗ '+err.message;
  }finally{
    EDIT.busy=false;renderEditBar();
  }
}

// ---------------------------------------------------------------------------
// Refresh from source: MindBody sends no CORS headers, so the browser can't
// read it directly. Instead the button fires the scrape workflow on GitHub
// Actions, waits for it to finish, then pulls the new files via the API.
// Needs the device token to also carry Actions: Read and write.
// ---------------------------------------------------------------------------
const WORKFLOW='refresh.yml';
const RF={busy:false,msg:''};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function renderRefreshBar(){
  const bar=document.getElementById('refreshbar');
  const stamp=LAST&&LAST.gen?new Date(LAST.gen).toLocaleString('zh-CN',
    {timeZone:'Australia/Sydney',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  const label=RF.busy?'刷新中…':(EDIT.token?'↻ 从源站刷新':'↻ 重新加载');
  const note=[RF.msg,!EDIT.token&&'从源站刷新需先在本设备打开 #edit 登录'].filter(Boolean).join(' · ');
  bar.innerHTML=`<button id="rBtn" class="go" ${RF.busy||EDIT.on?'disabled':''}>${label}</button>
    ${stamp?`<span class="stamp">🔄 最后刷新：${stamp}</span>`:''}
    <span class="note${RF.msg.startsWith('✗')?' warn':''}">${note}</span>`;
  document.getElementById('rBtn').onclick=EDIT.token?refreshFromSource:()=>{
    RF.msg='';load().catch(e=>{RF.msg='✗ '+e.message;renderRefreshBar();});
  };
}

async function refreshFromSource(){
  RF.busy=true;RF.msg='已触发，正在排队…';renderRefreshBar();
  const api=`https://api.github.com/repos/${REPO}/actions`;
  const headers={Authorization:'Bearer '+EDIT.token,Accept:'application/vnd.github+json'};
  const since=Date.now();
  try{
    const r=await fetch(`${api}/workflows/${WORKFLOW}/dispatches`,{method:'POST',
      headers:{...headers,'Content-Type':'application/json'},
      body:JSON.stringify({ref:'main',return_run_details:true})});
    if(r.status===401||r.status===403||r.status===404) throw new Error('令牌没有 Actions 读写权限（见 README）');
    if(!r.ok) throw new Error('触发失败 '+r.status);
    let runId=null;
    if(r.status===200){try{runId=(await r.json()).workflow_run_id||null;}catch{}}
    let run=null;
    while(Date.now()-since<5*60e3){
      await sleep(4000);
      if(!runId){
        // Older API: no run id in the reply, so pick the dispatch run we just started.
        const l=await fetch(`${api}/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=5&t=${Date.now()}`,{headers,cache:'no-store'});
        if(l.ok){
          const hit=(await l.json()).workflow_runs.find(x=>Date.parse(x.created_at)>=since-30e3);
          if(hit) runId=hit.id;
        }
        continue;
      }
      const g=await fetch(`${api}/runs/${runId}?t=${Date.now()}`,{headers,cache:'no-store'});
      if(!g.ok) continue;
      run=await g.json();
      if(run.status==='completed') break;
      RF.msg=run.status==='in_progress'?'正在从源站抓取 16 片场…':'已触发，正在排队…';
      renderRefreshBar();
    }
    if(!run||run.status!=='completed') throw new Error('等了 5 分钟还没完成，稍后再看');
    if(run.conclusion!=='success') throw new Error('抓取失败（'+run.conclusion+'）');
    await load(true);
    RF.msg='✓ 已从源站更新';
  }catch(err){
    RF.msg='✗ '+err.message;
  }finally{
    RF.busy=false;renderRefreshBar();
  }
}

function initEdit(){
  if(location.hash==='#edit'){
    history.replaceState(null,'',location.pathname+location.search);
    if(!EDIT.token){
      const t=prompt('粘贴 GitHub fine-grained 令牌（只给本仓库 Contents + Actions 读写权限）：','');
      if(t&&t.trim()){EDIT.token=t.trim();try{localStorage.setItem('pb_token',EDIT.token);}catch{}}
    }
    if(EDIT.token) EDIT.on=true;
  }
  if(location.hash==='#forget'){
    try{localStorage.removeItem('pb_token');}catch{}
    EDIT.token='';EDIT.on=false;
    history.replaceState(null,'',location.pathname+location.search);
    alert('已清除这台设备上的令牌。');
  }
}
initEdit();

load().catch(e=>{
  document.getElementById('panel').innerHTML=`<div class="err">数据加载失败：${e.message}</div>`;
});
</script>
