name: Refresh pickleball availability

on:
  schedule:
    # Every 30 min, offset off the :00/:30 peak — GitHub drops scheduled runs
    # that land on the busiest minutes, which was costing us most refreshes.
    - cron: "7,37 * * * *" # UTC
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape availability
        run: node scrape.mjs

      - name: Commit if changed
        run: |
          git config user.name "pickleball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/availability.json data/mine.json data/history.json
          git diff --cached --quiet && echo "No changes." || git commit -m "Refresh availability data"
          git push
